name: GeM Tender Alert

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. This runs every 3 hours (IST is UTC+5:30).
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: gem-tender-alert
  cancel-in-progress: false

jobs:
  check-bids:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tender alert bot
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: sanketharwale0078@gmail.com
          MAX_PAGES_PER_TERM: "3"
        run: python bot.py
      - name: Save seen-bid state
        run: |
          if [[ -n "$(git status --porcelain seen_bids.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_bids.json
            git commit -m "Update seen GeM bids"
            git push
          fi
