name: GeM Tender Alert

on:
  workflow_dispatch:
  schedule:
    # 08:00 India Standard Time (UTC+05:30) = 02:30 UTC
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: gem-tender-alert
  cancel-in-progress: false

jobs:
  check-bids:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check GeM public bid listings and email new matches
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: python tender_alert.py

      - name: Save seen-bid state
        if: success()
        run: |
          if ! git diff --quiet -- seen_bids.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_bids.json
            git commit -m "Update seen GeM bid state"
            git push
          else
            echo "No seen-bid state changes to save."
          fi
